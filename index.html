<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="description" content="Jacii Bolos - Confeitando com amor. Bolos, doces e salgados."><title>Jacii Bolos</title><style>
:root{--bg:#fff7f9;--card:#fff;--ink:#4a2c2a;--mut:#8a6f6c;--line:#f3d9e1;--acc:#c2517a;--accink:#fff;--ok:#15803d;--bad:#b91c1c;color-scheme:light;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme="dark"]{--bg:#17140f;--card:#221e18;--ink:#f3eee7;--mut:#a39a8f;--line:#38322a;--acc:#fb923c;--accink:#1a1209;--ok:#4ade80;--bad:#f87171;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px;max-width:1000px;margin:0 auto}
h1{font-size:22px;margin:0}
main{max-width:1000px;margin:0 auto;padding:0 16px 40px}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
input,textarea{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
.bar input{flex:1;min-width:160px}
button{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:9px 14px}
button.pri{background:var(--acc);color:var(--accink);border-color:var(--acc);font-weight:600}
button.del{color:var(--bad)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.img{aspect-ratio:1/1;background:var(--line);position:relative;display:flex;align-items:center;justify-content:center;color:var(--mut);font-size:13px}
.img img{width:100%;height:100%;object-fit:cover;display:block}
.sold .img img{filter:grayscale(1);opacity:.5}
.badge{position:absolute;top:10px;left:10px;background:var(--bad);color:#fff;font-size:12px;font-weight:700;padding:4px 10px;border-radius:99px}
.info{padding:12px;display:flex;flex-direction:column;gap:4px;flex:1}
.name{font-weight:600}
.desc{color:var(--mut);font-size:14px}
.price{font-size:18px;font-weight:700;margin-top:auto;padding-top:6px}
.sold .price{text-decoration:line-through;color:var(--mut)}
.stock{font-size:13px;font-weight:600;color:var(--ok)}
.sold .stock{color:var(--bad)}
.adm{display:flex;gap:6px;flex-wrap:wrap;padding:0 12px 12px}
.adm button{padding:6px 10px;font-size:13px}
.empty{text-align:center;color:var(--mut);padding:48px 16px}
dialog{border:1px solid var(--line);border-radius:16px;background:var(--bg);color:var(--ink);width:min(440px,92vw);padding:18px}
dialog::backdrop{background:rgba(0,0,0,.5)}
label{display:block;font-size:13px;color:var(--mut);margin:10px 0 4px}
.chk{display:flex;align-items:center;gap:8px;margin-top:12px;color:var(--ink);font-size:15px}
.chk input{width:auto}
.row{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
.prev{width:96px;height:96px;object-fit:cover;border-radius:10px;margin-top:8px;display:none}
.note{font-size:13px;color:var(--mut)}
header{display:block;padding-bottom:8px}
.banner{height:150px;border-radius:16px;background:linear-gradient(135deg,var(--acc),var(--line)) center/cover}
.hid{display:flex;gap:14px;align-items:flex-start;margin-top:-34px;padding:0 14px}
.hid>div{padding-top:38px}
.logo{width:84px;height:84px;border-radius:50%;object-fit:cover;border:4px solid var(--bg);background:var(--card);flex:none}
.links a{display:inline-block;margin-top:6px;color:var(--acc);font-weight:600;text-decoration:none}
.wa{display:block;margin-top:8px;text-align:center;background:#16a34a;color:#fff;border-radius:10px;padding:9px;font-weight:600;font-size:14px;text-decoration:none}
.admtop{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.clr{height:44px;padding:4px}
dialog{max-height:90vh;overflow:auto}
#pals{display:flex;gap:8px;flex-wrap:wrap}
#pals button{display:flex;align-items:center;gap:6px;padding:6px 10px;font-size:13px}
#pals i{width:14px;height:14px;border-radius:50%;display:inline-block;border:1px solid var(--line)}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));color:var(--bg);padding:10px 16px;border-radius:99px;font-size:14px;z-index:20;max-width:90vw;text-align:center}
</style></head><body>
<header>
  <div id="banner" class="banner"></div>
  <div class="hid"><img id="logo" class="logo" alt="Logo" hidden=""><div><h1 id="sName">Jacii Bolos</h1><p id="sBio" class="note" style="margin:2px 0">Confeitando com amor · Bolos, doces e salgados</p><p id="sLoc" class="note" style="margin:6px 0 0" hidden=""></p><div class="links"><a id="ig" href="https://www.instagram.com/jacii_bolos" target="_blank" rel="noopener">Instagram @jacii_bolos</a><a id="map" href="#" target="_blank" rel="noopener" style="margin-left:14px" hidden="">Ver no mapa</a></div></div></div>
  <div class="admtop"><button id="addBtn" class="pri" hidden="">+ Novo produto</button><button id="setBtn" hidden="">Configurar loja</button><button id="outBtn" hidden>Sair</button></div>
</header>
<main>
  <div class="bar">
    <input id="q" type="search" placeholder="Buscar produto…">
    <button id="hideSold">Ocultar esgotados</button>
  </div>
  <p id="admNote" class="note" hidden="">Modo administrador: você pode adicionar, editar, trocar a imagem e marcar produtos como esgotados.</p>
  <div id="grid" class="grid"></div>
  <div id="empty" class="empty" hidden=""></div>
<p class="note" style="text-align:center;margin-top:28px"><a href="#" id="admLink" style="color:inherit">Área da administradora</a></p></main>

<dialog id="dlg">
  <h2 id="dlgTitle" style="margin:0 0 4px;font-size:18px">Produto</h2>
  <label for="fName">Nome</label><input id="fName" maxlength="80">
  <label for="fPrice">Preço (R$)</label><input id="fPrice" inputmode="decimal" placeholder="29,90">
  <label for="fDesc">Descrição</label><textarea id="fDesc" rows="3" maxlength="300"></textarea>
  <label for="fImg">Imagem</label><input id="fImg" type="file" accept="image/*">
  <img id="prev" class="prev" alt="">
  <label class="chk"><input id="fSold" type="checkbox"> Esgotado</label>
  <p id="err" class="note" style="color:var(--bad)"></p>
  <div class="row">
    <button id="cancel">Cancelar</button>
    <button id="save" class="pri">Salvar</button>
  </div>
</dialog>

<dialog id="sdlg">
  <h2 style="margin:0 0 4px;font-size:18px">Configurar loja</h2>
  <label for="sfName">Nome da loja</label><input id="sfName" maxlength="60">
  <label for="sfBio">Descrição</label><textarea id="sfBio" rows="2" maxlength="200"></textarea>
  <label for="sfWa">WhatsApp com DDD (só números, ex: 5511999999999)</label><input id="sfWa" inputmode="numeric">
  <label for="sfIg">Link do Instagram</label><input id="sfIg">
  <label for="sfAddr">Endereço / localização</label><input id="sfAddr" maxlength="160" placeholder="Rua, número, bairro, cidade">
  <label for="sfMap">Link do Google Maps (opcional)</label><input id="sfMap" placeholder="Cole o link de compartilhar do Maps">
  <label for="sfHours">Horário de funcionamento (opcional)</label><input id="sfHours" maxlength="120" placeholder="Seg a Sáb, 8h às 18h">
  <label>Paletas prontas</label><div id="pals"></div>
  <label for="sfColor">Cor principal (botões e destaques)</label><input id="sfColor" type="color" class="clr">
  <label for="sfBg">Cor de fundo</label><input id="sfBg" type="color" class="clr">
  <label for="sfCard">Cor dos cartões</label><input id="sfCard" type="color" class="clr">
  <label for="sfInk">Cor do texto</label><input id="sfInk" type="color" class="clr">
  <button id="sfReset" type="button" style="margin-top:10px">Restaurar cores padrão</button>
  <label for="sfLogo">Foto de perfil / logo</label><input id="sfLogo" type="file" accept="image/*">
  <label for="sfBanner">Imagem de capa</label><input id="sfBanner" type="file" accept="image/*">
  <p id="sErr" class="note" style="color:var(--bad)"></p>
  <div class="row"><button id="sCancel">Cancelar</button><button id="sSave" class="pri">Salvar</button></div>
</dialog>
<dialog id="ldlg"><h2 style="margin:0 0 4px;font-size:18px">Entrar</h2>
<label for="lEmail">E-mail</label><input id="lEmail" type="email" autocomplete="username">
<label for="lPass">Senha</label><input id="lPass" type="password" autocomplete="current-password">
<p id="lErr" class="note" style="color:var(--bad)"></p>
<div class="row"><button id="lCancel">Cancelar</button><button id="lGo" class="pri">Entrar</button></div></dialog>

var items=[],S={},admin=false,editing=null,hideSold=false,loaded=false,loadErr=false,SES=null;
try{SES=JSON.parse(localStorage.getItem('jb_ses')||'null')}catch(e){}
function saveSes(s){SES=s;try{if(s)localStorage.setItem('jb_ses',JSON.stringify(s));else localStorage.removeItem('jb_ses')}catch(e){}}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function money(n){try{return Number(n).toLocaleString('pt-BR',{style:'currency',currency:'BRL'})}catch(e){return 'R$ '+n}}
function parsePrice(s){var n=parseFloat(String(s).replace(/\./g,'').replace(',','.'));return isNaN(n)?0:n}

function cv(id,k){var v=$('#'+id).value;return v.toLowerCase()===D[k]?'':v}
function setCols(p){$('#sfColor').value=p.color;$('#sfBg').value=p.bg;$('#sfCard').value=p.card;$('#sfInk').value=p.ink}

async function token(){
  if(!SES)return null;
  if(Date.now()>SES.exp-60000){
    var r=await fetch(BASE+'/auth/v1/token?grant_type=refresh_token',{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify({refresh_token:SES.refresh})});
    if(!r.ok){saveSes(null);return null}
    var j=await r.json();saveSes({access:j.access_token,refresh:j.refresh_token,exp:Date.now()+j.expires_in*1000});
  }
  return SES.access;
}
async function api(path,opt){
  opt=opt||{};var h={apikey:KEY},t=await token();if(t)h.Authorization='Bearer '+t;
  Object.assign(h,opt.headers||{});
  var r=await fetch(BASE+path,{method:opt.method||'GET',headers:h,body:opt.body});
  if(!r.ok){var m='';try{m=(await r.json()).message||''}catch(e){}throw new Error(m||('Erro '+r.status))}
  var tx=await r.text();return tx?JSON.parse(tx):null;
}

function shrink(file,max,q){return new Promise(function(ok,no){var u=URL.createObjectURL(file),im=new Image();im.onload=function(){var s=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);c.toBlob(function(b){b?ok(b):no(new Error('Imagem inválida'))},'image/jpeg',q)};im.onerror=function(){no(new Error('Imagem inválida'))};im.src=u})}
async function upload(file,max,q){
  var blob=await shrink(file,max,q),name=Date.now().toString(36)+Math.random().toString(36).slice(2,7)+'.jpg',t=await token();
  if(!t)throw new Error('Sessão expirada. Entre de novo.');
  var r=await fetch(BASE+'/storage/v1/object/fotos/'+name,{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+t,'Content-Type':'image/jpeg'},body:blob});

  }).join('');
  var e=$('#empty');e.hidden=false;
  if(!loaded)e.textContent='Carregando…';
  else if(loadErr)e.textContent='Não foi possível carregar o catálogo. Tente de novo em instantes.';
  else if(!items.length)e.textContent=admin?'Nenhum produto ainda. Toque em “+ Novo produto” para começar.':'Nenhum produto disponível no momento.';
  else if(!list.length)e.textContent='Nada encontrado.';
  else e.hidden=true;
}
function applyS(){
  var n=S.name||'Jacii Bolos';$('#sName').textContent=n;document.title=n;
  $('#sBio').textContent=S.bio||'Confeitando com amor · Bolos, doces e salgados';
  var lg=$('#logo');lg.src=S.logo||LOGO;lg.hidden=false;
  $('#banner').style.backgroundImage=S.banner?'url('+S.banner+')':'';
  var r=document.documentElement.style,m={'--acc':S.color,'--bg':S.bg,'--card':S.card,'--ink':S.ink};
  Object.keys(m).forEach(function(k){if(m[k])r.setProperty(k,m[k]);else r.removeProperty(k)});
  if(S.color)r.setProperty('--accink',lum(S.color)>.6?'#1a1209':'#fff');else r.removeProperty('--accink');
  if(S.bg||S.card||S.ink){r.setProperty('--line','color-mix(in srgb,var(--ink) 14%,var(--bg))');r.setProperty('--mut','color-mix(in srgb,var(--ink) 60%,var(--bg))')}else{r.removeProperty('--line');r.removeProperty('--mut')}
  if(S.bg)r.setProperty('color-scheme',lum(S.bg)<.5?'dark':'light');else r.removeProperty('color-scheme');
  $('#ig').href=S.instagram||'https://www.instagram.com/jacii_bolos';
  var lc=$('#sLoc'),mp=$('#map'),parts=[];
  if(S.addr)parts.push('Endereço: '+S.addr);if(S.hours)parts.push('Horário: '+S.hours);
  lc.innerHTML=parts.map(esc).join('<br>');lc.hidden=!parts.length;
  var mu=S.mapUrl||(S.addr?'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(S.addr):'');
  if(mu&&!/^https?:\/\//i.test(mu))mu='';
  mp.hidden=!mu;if(mu)mp.href=mu;
}
function ui(){
  $('#addBtn').hidden=!admin;$('#setBtn').hidden=!admin;$('#outBtn').hidden=!admin;$('#admNote').hidden=!admin;$('#admLink').hidden=admin;
}
async function load(){
  try{
    var r=await Promise.all([api('/rest/v1/products?select=*&order=created_at.asc'),api('/rest/v1/settings?id=eq.1&select=data')]);
    items=r[0]||[];S=Object.assign({whatsapp:'559887127187'},(r[1]&&r[1][0]&&r[1][0].data)||{});loadErr=false;
  }catch(e){loadErr=true}
  loaded=true;applyS();render();
}
function openForm(p){
  editing=p||null;
  $('#dlgTitle').textContent=p?'Editar produto':'Novo produto';
  $('#fName').value=p?p.name:'';$('#fPrice').value=p?String(p.price).replace('.',','):'';
  $('#fDesc').value=p?(p.description||''):'';$('#fSold').checked=!!(p&&p.sold_out);
  $('#fImg').value='';$('#err').textContent='';
  var pv=$('#prev');if(p&&p.image_url){pv.src=p.image_url;pv.style.display='block'}else{pv.style.display='none'}
  $('#dlg').showModal();
}
async function saveForm(){
  var name=$('#fName').value.trim();
  if(!name){$('#err').textContent='Informe o nome do produto.';return}
  var btn=$('#save');btn.disabled=true;btn.textContent='Salvando…';$('#err').textContent='';
  try{
    var img=editing?editing.image_url||'':'',f=$('#fImg').files[0];
    if(f)img=await upload(f,800,.75);
    var row={name:name,price:parsePrice($('#fPrice').value),description:$('#fDesc').value.trim(),sold_out:$('#fSold').checked,image_url:img||null};
    if(editing)await send('/rest/v1/products?id=eq.'+editing.id,'PATCH',row);else await send('/rest/v1/products','POST',row);
    $('#dlg').close();await load();toast('Produto salvo');
  }catch(e){$('#err').textContent='Não foi possível salvar: '+e.message}
  btn.disabled=false;btn.textContent='Salvar';
}
function openSettings(){
  $('#sfName').value=S.name||'Jacii Bolos';$('#sfBio').value=S.bio||'';$('#sfWa').value=S.whatsapp||'';
  $('#sfIg').value=S.instagram||'https://www.instagram.com/jacii_bolos';$('#sfAddr').value=S.addr||'';$('#sfMap').value=S.mapUrl||'';$('#sfHours').value=S.hours||'';
  $('#sfColor').value=S.color||D.color;$('#sfBg').value=S.bg||D.bg;$('#sfCard').value=S.card||D.card;$('#sfInk').value=S.ink||D.ink;
  $('#sfLogo').value='';$('#sfBanner').value='';$('#sErr').textContent='';$('#sdlg').showModal();
}
async function saveSettings(){
  var b=$('#sSave');b.disabled=true;b.textContent='Salvando…';$('#sErr').textContent='';
  try{
    var lf=$('#sfLogo').files[0],bf=$('#sfBanner').files[0];
    var logo=lf?await upload(lf,320,.85):(S.logo||''),banner=bf?await upload(bf,1400,.75):(S.banner||'');
    var d={name:$('#sfName').value.trim(),bio:$('#sfBio').value.trim(),whatsapp:$('#sfWa').value.replace(/\D/g,''),instagram:$('#sfIg').value.trim(),addr:$('#sfAddr').value.trim(),mapUrl:$('#sfMap').value.trim(),hours:$('#sfHours').value.trim(),color:cv('sfColor','color'),bg:cv('sfBg','bg'),card:cv('sfCard','card'),ink:cv('sfInk','ink'),logo:logo,banner:banner};
    var res=await send('/rest/v1/settings?id=eq.1','PATCH',{data:d},'return=representation');
    if(!res||!res.length)await send('/rest/v1/settings','POST',{id:1,data:d});
    $('#sdlg').close();await load();toast('Configurações salvas');
  }catch(e){$('#sErr').textContent='Não foi possível salvar: '+e.message}
  b.disabled=false;b.textContent='Salvar';
}
async function login(){
  var b=$('#lGo');b.disabled=true;$('#lErr').textContent='';
  try{
    var r=await fetch(BASE+'/auth/v1/token?grant_type=password',{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify({email:$('#lEmail').value.trim(),password:$('#lPass').value})});
    var j=await r.json();
    if(!r.ok)throw new Error('E-mail ou senha incorretos.');
    saveSes({access:j.access_token,refresh:j.refresh_token,exp:Date.now()+j.expires_in*1000});
    admin=true;$('#lPass').value='';$('#ldlg').close();ui();render();toast('Você entrou');
  }catch(e){$('#lErr').textContent=e.message}
  b.disabled=false;
}
$('#grid').addEventListener('click',async function(ev){
  var b=ev.target.closest('button[data-a]');if(!b||!admin)return;
  var id=b.dataset.id,p=items.find(function(x){return x.id===id});if(!p)return;
  try{
    if(b.dataset.a==='toggle'){await send('/rest/v1/products?id=eq.'+id,'PATCH',{sold_out:!p.sold_out});await load()}
    else if(b.dataset.a==='edit')openForm(p);
    else if(b.dataset.a==='del'){
      if(b.dataset.armed){await api('/rest/v1/products?id=eq.'+id,{method:'DELETE'});await load()}
      else{b.dataset.armed='1';b.textContent='Confirmar exclusão';setTimeout(function(){b.dataset.armed='';b.textContent='Excluir'},3500)}
    }
  }catch(e){toast('Erro: '+e.message,1)}
});
$('#addBtn').onclick=function(){openForm(null)};
$('#cancel').onclick=function(){$('#dlg').close()};$('#save').onclick=saveForm;
$('#setBtn').onclick=openSettings;$('#sCancel').onclick=function(){$('#sdlg').close()};$('#sSave').onclick=saveSettings;
$('#admLink').onclick=function(e){e.preventDefault();$('#lErr').textContent='';$('#ldlg').showModal()};
$('#lCancel').onclick=function(){$('#ldlg').close()};$('#lGo').onclick=login;
$('#outBtn').onclick=function(){saveSes(null);admin=false;ui();render()};
$('#q').oninput=render;
$('#hideSold').onclick=function(){hideSold=!hideSold;this.textContent=hideSold?'Mostrar esgotados':'Ocultar esgotados';render()};
$('#fImg').onchange=function(){var f=this.files[0],pv=$('#prev');if(f){pv.src=URL.createObjectURL(f);pv.style.display='block'}};
$('#pals').innerHTML=PAL.map(function(p,i){return '<button type="button" data-i="'+i+'"><i style="background:'+p.color+'"></i>'+p.n+'</button>'}).join('');
$('#pals').onclick=function(e){var b=e.target.closest('button[data-i]');if(b)setCols(PAL[b.dataset.i])};
$('#sfReset').onclick=function(){setCols(D)};
applyS();render();ui();
(async function(){
  if(SES){admin=!!(await token());ui()}
  await load();
})();
</script></body></html>
